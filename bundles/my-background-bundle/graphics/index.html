<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stream Overlay (Right Slide Out Popup)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background-image: url('bgmiuchi.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* チーム名・走者名表示グリッド（完全座標指定） */
        .runners-grid {
            position: absolute;
            top: 1px;
            left: 0px;
            width: 1825px;
            height: 845px;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, 365px);
            grid-template-rows: repeat(4, 269px); 
        }

        .runner-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff66;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 34px; 
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        
        .runner-box .t-name { font-size: 14px; font-weight: bold; color: #ffeb3b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .runner-box .m-name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }

        /* 順位表示（ポジションマップ）の配置変更 */
        .position-map-container {
            position: absolute;
            top: 810px;
            left: 1465px;
            width: 455px;
            height: 155px;
            z-index: 10;
        }

        .map-line {
            position: absolute;
            top: 50%;
            left: 20px; 
            right: 20px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 2px;
            transform: translateY(-50%);
        }

        .team-circle {
            position: absolute;
            top: 50%;
            width: 40px; 
            height: 40px;
            background: #009688; 
            color: white;
            border: 2px solid white;
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            /* 🔴 略称が収まるようにフォントサイズを微調整 */
            font-size: 13px; 
            font-weight: 900; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s, width 0.4s, height 0.4s, font-size 0.4s, background-color 0.4s;
            transform: translate(-50%, -50%); 
        }

        .team-circle.rank-1 { background: #ff1744; border-color: #ffea00; width: 50px; height: 50px; font-size: 16px; z-index: 100; } 
        .team-circle.rank-2 { background: #ff9100; width: 45px; height: 45px; font-size: 15px; z-index: 90; }  
        .team-circle.rank-3 { background: #00b0ff; width: 45px; height: 45px; font-size: 15px; z-index: 80; }  
        .team-circle.is-tie { width: 35px; height: 35px; font-size: 11px; opacity: 0.95; border: 2px solid #fff; }

        /* タイマー設定 */
        .timer-container {
            position: absolute;
            bottom: 40px;
            left: 50px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 8px;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        /* ポップアップ通知（ラップタイム） */
        .popup-notification {
            position: absolute;
            bottom: 10px; 
            right: -500px; 
            width: 430px; 
            background: rgba(20, 25, 35, 0.95); 
            border-left: 6px solid #ff9800; 
            border-radius: 4px 8px 8px 4px;
            padding: 10px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 30;
            opacity: 0;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-in-out;
        }

        .popup-notification.slide-in { right: 15px; opacity: 1; } 
        .popup-notification.slide-out { right: -500px; opacity: 0; } 

        .popup-title { font-size: 13px; font-weight: bold; color: #ff9800; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 4px; }
        
        .popup-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .popup-table th { padding: 4px; text-align: center; font-size: 10px; color: #aaa; border-bottom: 2px solid rgba(255,255,255,0.2); }
        .popup-table td { padding: 4px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        
        .pop-rank-1 { color: #ff1744; font-weight: bold; }
        .pop-team-num { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .pop-time-diff { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #00ff66; }
        .pop-time-leader { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div class="background-layer"></div>
    
    <div class="runners-grid" id="runners-grid">
        <!-- JSで19チーム分生成 -->
    </div>

    <div class="position-map-container" id="map-container">
        <div class="map-line"></div>
    </div>

    <div class="timer-container" id="timer-display">00:00:00</div>

    <div class="popup-notification" id="popup-board">
        <div class="popup-title" id="popup-title-text">⏱️ LAP UPDATE</div>
        <table class="popup-table">
            <thead>
                <tr>
                    <th style="width: 15%;">順位</th>
                    <th style="width: 35%;">チーム</th>
                    <th style="width: 50%;">トップ差 / タイム</th>
                </tr>
            </thead>
            <tbody id="popup-tbody"></tbody>
        </table>
    </div>

    <script>
        const timerRep = nodecg.Replicant('streamTimer');
        const sharedCsvRep = nodecg.Replicant('sharedCsvData', { defaultValue: '' });
        const selectedMembersRep = nodecg.Replicant('lapSelectedMembers', { defaultValue: {} });
        
        const teamsDataList = [
            "カタカナ", "くまぼく。Reimagined", "世界最速救済機構 ISRI", "暴れん坊将軍VII", 
            "アストラルヒーローズ～至高の一杯～", "おれたちはしょうきにもどった", "名古屋酒乱会", 
            "ドラクエソルジャーズ", "ドラナナｼｺ×2", "ＯＮＥ ４ ＡＬＬ", "40年後もドラクエが好き", 
            "導かれし7匹の(･∀･)", "Ξ", "あまいおかし", "オレハマッテルゼⅩⅠ", "ORAeSports", 
            "やきにく（游玄亭）たべたーい！", "老化2026〜加齢なる一族〜", "ゆるふわ"
        ];

        // 🔴 追加：順位表示用のチーム略称リスト
        const teamShortNames = [
            "カタ", "くま", "救済", "将軍", "アス", "正気", "酒乱", "ソル", "ナナ", "O4A",
            "40", "7匹", "Ξ", "あま", "オレ", "ORA", "焼肉", "老化", "ゆる"
        ];

        const runnersGrid = document.getElementById('runners-grid');
        for (let i = 0; i < 20; i++) {
            const box = document.createElement('div');
            if (i >= teamsDataList.length) {
                box.style.visibility = 'hidden';
            } else {
                box.className = 'runner-box';
                box.id = `runner-box-${i + 1}`;
                box.innerHTML = `
                    <span class="t-name">${teamsDataList[i]}</span>
                    <span class="m-name" id="runner-name-${i + 1}">準備中...</span>
                `;
            }
            runnersGrid.appendChild(box);
        }

        selectedMembersRep.on('change', (newVal) => {
            if (!newVal) return;
            for (let i = 1; i <= 19; i++) {
                const nameEl = document.getElementById(`runner-name-${i}`);
                if (nameEl) {
                    nameEl.innerText = newVal[i] ? newVal[i] : '---';
                }
            }
        });

        const container = document.getElementById('map-container');
        const timerDisplay = document.getElementById('timer-display');
        const popupBoard = document.getElementById('popup-board');
        const popupTbody = document.getElementById('popup-tbody');
        const popupTitleText = document.getElementById('popup-title-text');

        let previousTeamLapsMap = {}; 
        let isFirstLoad = true;
        let popupTimeoutToken = null;

        timerRep.on('change', (newVal) => {
            if (newVal && newVal.formatted) {
                timerDisplay.innerText = newVal.formatted;
            }
        });

        function parseCSV(text) {
            const rows = [];
            const pattern = /"([^"]*(?:""[^"]*)*)"|([^,]+)|(?<=,|^)(?=,|$)/g;
            text.split(/\r?\n/).forEach(line => {
                if (!line.trim()) return;
                const matches = line.matchAll(pattern);
                const row = Array.from(matches).map(m => (m[1] !== undefined ? m[1].replace(/""/g, '"') : m[2] || '').trim());
                rows.push(row);
            });
            return rows;
        }

        function timeToSeconds(timeStr) {
            if (!timeStr || timeStr.includes('-')) return Infinity; 
            const parts = timeStr.split(':');
            if (parts.length === 3) {
                return (parseInt(parts[0], 10) || 0) * 3600 + (parseInt(parts[1], 10) || 0) * 60 + (parseInt(parts[2], 10) || 0);
            }
            return Infinity;
        }

        function formatTimeDiff(diffSeconds) {
            if (diffSeconds <= 0) return "0.0";
            const mins = Math.floor(diffSeconds / 60);
            const secs = Math.floor(diffSeconds % 60);
            return `+${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updatePositionMap(csvText) {
            if (!csvText || typeof csvText !== 'string' || !csvText.trim()) return;
            
            const rows = parseCSV(csvText);
            if (rows.length === 0) return;

            const rowTitles = rows.map(r => r[0]); 
            const headers = rows[0];
            const teamDataListObj = [];

            let triggeredLapIndex = -1;

            for (let colIdx = 1; colIdx < headers.length; colIdx++) {
                const teamName = headers[colIdx];
                if (!teamName) continue;

                const laps = [];
                for (let rowIdx = 1; rowIdx < rows.length; rowIdx++) {
                    const cell = rows[rowIdx][colIdx];
                    if (cell && cell !== '-' && cell !== '') laps.push(cell);
                }

                const currentLapCount = laps.length;
                const teamNumStr = String(colIdx);
                // 🔴 略称を取得（1列目は colIdx=1 なので -1 して配列にアクセス）
                const shortName = teamShortNames[colIdx - 1] || teamNumStr;

                if (!isFirstLoad) {
                    const prevCount = previousTeamLapsMap[teamNumStr] || 0;
                    if (currentLapCount > prevCount) {
                        triggeredLapIndex = currentLapCount; 
                    }
                }

                previousTeamLapsMap[teamNumStr] = currentLapCount;

                teamDataListObj.push({
                    id: `team-circle-node-${colIdx}`, 
                    displayNum: shortName, // 略称を表示用に設定
                    lapCount: currentLapCount,
                    lastTime: currentLapCount > 0 ? laps[currentLapCount - 1] : '--:--:--',
                    allLaps: laps 
                });
            }

            isFirstLoad = false;

            teamDataListObj.sort((a, b) => {
                if (b.lapCount !== a.lapCount) return b.lapCount - a.lapCount; 
                if (a.lapCount > 0) {
                    return timeToSeconds(a.lastTime) - timeToSeconds(b.lastTime);
                }
                return 0;
            });

            let currentRank = 1;
            let tieGroups = {};

            for (let i = 0; i < teamDataListObj.length; i++) {
                const currentTeam = teamDataListObj[i];
                if (i > 0) {
                    const prevTeam = teamDataListObj[i - 1];
                    if (currentTeam.lapCount !== prevTeam.lapCount || (currentTeam.lapCount > 0 && currentTeam.lastTime !== prevTeam.lastTime)) {
                        currentRank = i + 1;
                    }
                }
                currentTeam.rank = currentRank;

                if (!tieGroups[currentRank]) tieGroups[currentRank] = [];
                tieGroups[currentRank].push(currentTeam);
            }

            const totalTeams = teamDataListObj.length;
            teamDataListObj.forEach((team) => {
                let circle = document.getElementById(team.id);
                if (!circle) {
                    circle = document.createElement('div');
                    circle.id = team.id;
                    circle.className = 'team-circle';
                    container.appendChild(circle);
                }
                circle.innerText = team.displayNum;

                const sortedIndex = teamDataListObj.indexOf(team); 
                let leftPositionPercent = ((totalTeams - 1 - sortedIndex) / (totalTeams - 1)) * 100;

                circle.className = 'team-circle';
                if (team.rank <= 3) circle.classList.add(`rank-${team.rank}`);

                const isTie = tieGroups[team.rank].length > 1;
                if (isTie) {
                    circle.classList.add('is-tie');
                    const groupIndex = tieGroups[team.rank].indexOf(team);
                    const groupCount = tieGroups[team.rank].length;
                    const xOffset = (groupIndex - (groupCount - 1) / 2) * 2.5; 
                    leftPositionPercent += xOffset;
                    const yOffset = (groupIndex % 2 === 0) ? '-15px' : '15px';
                    circle.style.transform = `translate(-50%, calc(-50% + ${yOffset}))`;
                } else {
                    circle.style.transform = `translate(-50%, -50%)`;
                }
                circle.style.left = `${leftPositionPercent}%`;
            });

            if (triggeredLapIndex !== -1) {
                const targetLapTitle = rowTitles[triggeredLapIndex]; 

                const activePopupTeams = teamDataListObj.filter(t => t.lapCount >= triggeredLapIndex).map(t => {
                    return {
                        displayNum: t.displayNum,
                        lapTimeStr: t.allLaps[triggeredLapIndex - 1], 
                        lapSeconds: timeToSeconds(t.allLaps[triggeredLapIndex - 1])
                    };
                });

                activePopupTeams.sort((a, b) => a.lapSeconds - b.lapSeconds);

                if (activePopupTeams.length > 0) {
                    const leaderSeconds = activePopupTeams[0].lapSeconds;
                    popupTitleText.innerText = `⏱️ 通過情報: ${targetLapTitle}`;
                    popupTbody.innerHTML = '';
                    
                    activePopupTeams.forEach((team, idx) => {
                        const rank = idx + 1;
                        const tr = document.createElement('tr');
                        
                        let timeCellHtml = '';
                        if (rank === 1) {
                            timeCellHtml = `<span class="pop-time-leader">${team.lapTimeStr}</span>`;
                        } else {
                            const diff = team.lapSeconds - leaderSeconds;
                            timeCellHtml = `<span class="pop-time-diff">${formatTimeDiff(diff)}</span>`;
                        }

                        tr.innerHTML = `
                            <td class="${rank === 1 ? 'pop-rank-1' : ''}">${rank}位</td>
                            <td><span class="pop-team-num">${team.displayNum}</span></td>
                            <td>${timeCellHtml}</td>
                        `;
                        popupTbody.appendChild(tr);
                    });

                    if (popupTimeoutToken) clearTimeout(popupTimeoutToken);
                    popupBoard.classList.remove('slide-in', 'slide-out');
                    
                    setTimeout(() => { popupBoard.classList.add('slide-in'); }, 50);

                    popupTimeoutToken = setTimeout(() => {
                        popupBoard.classList.remove('slide-in');
                        popupBoard.classList.add('slide-out');
                    }, 7000); 
                }
            }
        }

        sharedCsvRep.on('change', (newVal) => {
            if (newVal) {
                updatePositionMap(newVal);
            }
        });
    </script>
</body>
</html>
