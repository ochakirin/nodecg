<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 15px; background: #f5f5f5; margin: 0; }
        
        .global-panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid #ff9800; display: flex; gap: 15px; align-items: center; }
        .global-panel label { font-weight: bold; color: #333; }
        .global-panel input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .global-panel button { padding: 10px 20px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; background: #e91e63; }
        
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        
        .player-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #607d8b; display: flex; flex-direction: column; gap: 10px; }
        
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 12px; font-weight: bold; color: #666; }
        .input-group input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .score-ctrl { display: flex; align-items: center; gap: 4px; }
        .score-ctrl input { flex: 1; text-align: center; font-size: 16px; font-weight: bold; padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 40px; }
        .btn-score { padding: 6px 4px; font-size: 12px; font-weight: bold; background: #eceff1; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; flex: none; }
        .btn-score:hover { background: #cfd8dc; }

        .preview-box { height: 100px; background: #e0e0e0; border: 2px dashed #9e9e9e; border-radius: 4px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .preview-box img { width: 100%; height: 100%; object-fit: contain; background: white; display: none; }
        .preview-box span { font-size: 12px; font-weight: bold; color: #757575; position: absolute; }

        .action-row { display: flex; gap: 5px; }
        .btn-action { flex: 1; padding: 8px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-open { background: #00bcd4; } .btn-open.opened { background: #ff9800; }
        .btn-clear { background: #9e9e9e; }
        .btn-link { background: #4caf50; flex: none; width: 40px; }
    </style>
</head>
<body>

    <div class="global-panel">
        <label>問題（テーマ）</label>
        <input type="text" id="global-theme" placeholder="問題を入力" onchange="updateTheme(this.value)">
        <button onclick="openAll()">🎉 一斉オープン</button>
        <button onclick="clearAllAnswers()" style="background:#607d8b;">🧹 全回答消去</button>
    </div>

    <div class="grid-container" id="players-container">
        <!-- JSで8人分生成 -->
    </div>

    <script>
        const gameRep = nodecg.Replicant('dqChickenState', {
            defaultValue: { theme: '', names: Array(8).fill(''), scores: Array(8).fill(0), answers: Array(8).fill(''), isOpen: Array(8).fill(false) },
            persistent: true
        });

        function modifyState(modifierFunc) {
            if (!gameRep.value) return;
            const s = JSON.parse(JSON.stringify(gameRep.value));
            if (!s.names) s.names = Array(8).fill('');
            if (!s.scores) s.scores = Array(8).fill(0);
            if (!s.answers) s.answers = Array(8).fill('');
            if (!s.isOpen) s.isOpen = Array(8).fill(false);
            modifierFunc(s);
            gameRep.value = s;
        }

        const container = document.getElementById('players-container');
        for(let i=0; i<8; i++) {
            container.innerHTML += `
                <div class="player-card">
                    <div class="input-group">
                        <label>走者名 ${i+1}</label>
                        <input type="text" id="name-${i}" placeholder="名前" onchange="updateName(${i}, this.value)">
                    </div>
                    <div class="input-group">
                        <label>得点</label>
                        <div class="score-ctrl">
                            <button class="btn-score" onclick="addScore(${i}, -10)">-10</button>
                            <button class="btn-score" onclick="addScore(${i}, -1)">-1</button>
                            <input type="number" id="score-${i}" value="0" onchange="updateScore(${i}, this.value)">
                            <button class="btn-score" onclick="addScore(${i}, 1)">+1</button>
                            <button class="btn-score" onclick="addScore(${i}, 10)">+10</button>
                        </div>
                    </div>
                    <div class="preview-box">
                        <span id="prev-text-${i}">未提出</span>
                        <img id="prev-img-${i}" src="">
                    </div>
                    <div class="action-row">
                        <button class="btn-action btn-open" id="btn-open-${i}" onclick="toggleOpen(${i})">👁️ 開く</button>
                        <button class="btn-action btn-clear" onclick="clearAnswer(${i})">消去</button>
                        <button class="btn-action btn-link" onclick="copyUrl(${i})" title="パッドURLコピー">🔗</button>
                    </div>
                </div>
            `;
        }

        // 🔴 過去の他ゲームと全く同じURL発行の仕組みに戻しました
        window.getPadUrl = function(idx) { 
            const bundleName = window.location.pathname.split('/')[2] || 'my-background-bundle';
            return `${window.location.origin}/bundles/${bundleName}/dashboard/dqchicken_pad.html?p=${idx}&standalone=true`; 
        }
        window.copyUrl = function(idx) { navigator.clipboard.writeText(getPadUrl(idx)).then(() => alert(`走者${idx+1}のパッドURLをコピーしました`)); }

        window.updateTheme = function(val) { modifyState(s => s.theme = val); }
        window.updateName = function(idx, val) { modifyState(s => s.names[idx] = val); }
        window.updateScore = function(idx, val) { modifyState(s => s.scores[idx] = parseInt(val, 10) || 0); }
        window.addScore = function(idx, amount) { modifyState(s => s.scores[idx] += amount); }

        window.toggleOpen = function(idx) {
            modifyState(s => {
                s.isOpen[idx] = !s.isOpen[idx];
                if(s.isOpen[idx]) nodecg.sendMessage('play_open_se');
            });
        }

        window.openAll = function() {
            modifyState(s => {
                let changed = false;
                for(let i=0; i<8; i++) {
                    if(!s.isOpen[i] && s.answers[i] !== '') {
                        s.isOpen[i] = true;
                        changed = true;
                    }
                }
                if(changed) nodecg.sendMessage('play_open_se');
            });
        }

        window.clearAnswer = function(idx) {
            modifyState(s => { s.answers[idx] = ''; s.isOpen[idx] = false; });
        }
        window.clearAllAnswers = function() {
            if(!confirm("全員の回答を消去しますか？（名前と点数は残ります）")) return;
            modifyState(s => {
                s.answers = Array(8).fill('');
                s.isOpen = Array(8).fill(false);
            });
        }

        gameRep.on('change', (newVal) => {
            if(!newVal) return;
            
            const themeInp = document.getElementById('global-theme');
            if (themeInp && document.activeElement !== themeInp) themeInp.value = newVal.theme || '';

            for(let i=0; i<8; i++) {
                const nameInp = document.getElementById(`name-${i}`);
                if (nameInp && document.activeElement !== nameInp) nameInp.value = (newVal.names && newVal.names[i]) ? newVal.names[i] : '';

                const scoreInp = document.getElementById(`score-${i}`);
                if (scoreInp && document.activeElement !== scoreInp) scoreInp.value = (newVal.scores && newVal.scores[i]) ? newVal.scores[i] : 0;

                const prevImg = document.getElementById(`prev-img-${i}`);
                const prevText = document.getElementById(`prev-text-${i}`);
                if (newVal.answers && newVal.answers[i] !== '') {
                    prevImg.src = newVal.answers[i];
                    prevImg.style.display = 'block';
                    prevText.style.display = 'none';
                } else {
                    prevImg.src = '';
                    prevImg.style.display = 'none';
                    prevText.style.display = 'block';
                }

                const btnOpen = document.getElementById(`btn-open-${i}`);
                if (btnOpen) {
                    if (newVal.isOpen && newVal.isOpen[i]) {
                        btnOpen.innerText = '🔼 閉じる';
                        btnOpen.classList.add('opened');
                    } else {
                        btnOpen.innerText = '👁️ 開く';
                        btnOpen.classList.remove('opened');
                    }
                }
            }
        });
    </script>
</body>
</html>
