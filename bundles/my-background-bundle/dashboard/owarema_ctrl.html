<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 10px; margin: 0; background: #f5f5f5; }
        .wrapper { display: flex; flex-wrap: wrap; gap: 15px; width: 100%; }
        .col { flex: 1; min-width: 490px; background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .col-a { border-top: 5px solid #ff9800; }
        .col-b { border-top: 5px solid #2196f3; }
        .col-c { border-top: 5px solid #4caf50; } 
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team-title { font-size: 18px; font-weight: bold; }
        .active-btn { background: #4CAF50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .active-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .input-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .input-group label { width: 70px; font-size: 13px; font-weight: bold; }
        .input-group input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        .player-row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; padding: 6px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; }
        .player-row.is-leader { background: #fff3e0; border-color: #ffe0b2; }
        .player-row input[type="text"] { width: 70px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-sm { padding: 4px 6px; font-size: 11px; cursor: pointer; border: none; border-radius: 3px; color: white; transition: 0.1s; font-weight: bold; }
        .btn-sm:hover { opacity: 0.8; }
        .btn-copy { background: #009688; }
        .btn-jump { background: #795548; }
        .btn-clear { background: #9e9e9e; }
        
        .disp-label { font-size: 11px; font-weight: bold; cursor: pointer; background: #e8eaf6; padding: 4px 6px; border-radius: 4px; border: 1px solid #c5cae9; color: #3f51b5; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
        .open-label { font-size: 11px; font-weight: bold; cursor: pointer; background: #e0f7fa; padding: 4px 6px; border-radius: 4px; border: 1px solid #b2ebf2; color: #00838f; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
        .correct-label { font-size: 11px; font-weight: bold; cursor: pointer; background: #ffebee; padding: 4px 6px; border-radius: 4px; border: 1px solid #ffcdd2; color: #d32f2f; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
        
        .p-score-box { display: flex; align-items: center; gap: 2px; background: #fff8e1; border: 1px solid #ffecb3; padding: 2px; border-radius: 4px; }
        .p-score-btn { padding: 2px 5px; font-size: 10px; font-weight: bold; cursor: pointer; border: none; background: #ffca28; color: #fff; border-radius: 2px; }
        .p-score-btn:hover { background: #ffb300; }
        .p-score-val { font-size: 11px; font-weight: bold; width: 14px; text-align: center; color: #f57f17; }
        
        .is-active-badge { display: inline-block; padding: 2px 6px; background: #ff0000; color: white; border-radius: 10px; font-size: 12px; margin-left: 10px; }

        .team-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .team-actions button { flex: 1 1 45%; padding: 10px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
        .btn-open-all { background: #ff9800; }
        .btn-apply-open { background: #00bcd4; } 
        .btn-apply-correct { background: #e91e63; }
        .btn-clear-team { background: #607d8b; }
    </style>
</head>
<body>

    <div class="wrapper" id="team-panels-container">
        <!-- JSで3チーム分生成 -->
    </div>

    <script>
        const gameRep = nodecg.Replicant('owarematenState', {
            defaultValue: {
                teamNames: ['チームA', 'チームB', 'チームC'],
                teamThemes: ['', '', ''],
                teamScores: [0, 0, 0],
                activeTeam: 0,
                names: Array(21).fill(''),
                answers: Array(21).fill(''),
                isOpen: Array(21).fill(false),
                isCorrect: Array(21).fill(false),
                nextCorrect: Array(21).fill(false),
                nextOpen: Array(21).fill(false),
                playerScores: Array(21).fill(0),
                isDisplayed: Array(21).fill(false) 
            },
            persistent: true
        });

        // 🔴 過去の短いデータが来ても、指定の長さまで安全に補完する関数
        function getSafeArray(source, length, defaultValue) {
            const arr = Array.isArray(source) ? [...source] : [];
            while (arr.length < length) arr.push(defaultValue);
            return arr;
        }

        const colors = ['#ff9800', '#2196f3', '#4caf50'];
        const teamLabels = ['🟥 チームA', '🟦 チームB', '🟩 チームC'];
        const container = document.getElementById('team-panels-container');

        for(let t=0; t<3; t++) {
            container.innerHTML += `
                <div class="col" style="border-top: 5px solid ${colors[t]};">
                    <div class="header-row">
                        <div class="team-title">${teamLabels[t]} <span id="badge-${t}" class="is-active-badge" style="display:none;">配信中</span></div>
                        <button class="active-btn" id="btn-active-${t}">配信画面に表示</button>
                    </div>
                    <div class="input-group">
                        <label>チーム名</label><input type="text" id="t-name-${t}" placeholder="チーム名" onchange="updateTeamMeta(${t}, 'name', this.value)">
                    </div>
                    <div class="input-group">
                        <label>お題</label><input type="text" id="t-theme-${t}" placeholder="お題" onchange="updateTeamMeta(${t}, 'theme', this.value)">
                    </div>
                    <div class="input-group">
                        <label>全体得点</label>
                        <div style="display:flex; gap:5px; flex:1;">
                            <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(${t}, -10)">-10</button>
                            <input type="number" id="t-score-${t}" value="0" style="text-align:center; font-weight:bold; font-size:16px;" onchange="updateTeamMeta(${t}, 'score', this.value)">
                            <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(${t}, 10)">+10</button>
                        </div>
                    </div>
                    <hr>
                    <div id="players-${t}"></div>

                    <div class="team-actions">
                        <button class="btn-apply-open" onclick="applyOpen(${t})">👁️ チェックした人をオープン</button>
                        <button class="btn-apply-correct" onclick="applyCorrect(${t})">🔴 赤背景を一斉反映</button>
                        <button class="btn-open-all" onclick="openAll(${t})">🎉 残りを一斉オープン</button>
                        <button class="btn-clear-team" onclick="clearTeamAnswers(${t})">🧹 回答を消去</button>
                    </div>
                </div>
            `;
        }

        window.getPadUrl = function(idx) { return `${window.location.origin}/bundles/my-background-bundle/dashboard/owarema_pad.html?p=${idx}&standalone=true`; }
        window.copyUrl = function(idx) { navigator.clipboard.writeText(getPadUrl(idx)).then(() => alert(`プレイヤー${idx+1}のパッドURLをコピーしました`)); }
        window.openUrl = function(idx) { window.open(getPadUrl(idx), '_blank'); }

        function updateTeamMeta(teamIdx, key, val) {
            if (!gameRep.value) return;
            if (key === 'name') {
                const arr = getSafeArray(gameRep.value.teamNames, 3, '');
                arr[teamIdx] = val;
                gameRep.value.teamNames = arr;
            }
            if (key === 'theme') {
                const arr = getSafeArray(gameRep.value.teamThemes, 3, '');
                arr[teamIdx] = val;
                gameRep.value.teamThemes = arr;
            }
            if (key === 'score') {
                const arr = getSafeArray(gameRep.value.teamScores, 3, 0);
                arr[teamIdx] = parseInt(val, 10) || 0;
                gameRep.value.teamScores = arr;
            }
        }

        window.addScore = function(teamIdx, amount) { 
            if (!gameRep.value) return;
            const arr = getSafeArray(gameRep.value.teamScores, 3, 0);
            arr[teamIdx] += amount;
            gameRep.value.teamScores = arr;
        }

        window.addPlayerScore = function(pIdx, amount) { 
            if (!gameRep.value) return;
            const arr = getSafeArray(gameRep.value.playerScores, 21, 0);
            arr[pIdx] = Math.max(0, arr[pIdx] + amount);
            gameRep.value.playerScores = arr;
        }

        setTimeout(() => {
            document.getElementById('btn-active-0').onclick = () => { if(gameRep.value) gameRep.value.activeTeam = 0; };
            document.getElementById('btn-active-1').onclick = () => { if(gameRep.value) gameRep.value.activeTeam = 1; };
            document.getElementById('btn-active-2').onclick = () => { if(gameRep.value) gameRep.value.activeTeam = 2; };
        }, 100);

        function renderPlayers() {
            [0, 1, 2].forEach(teamIdx => {
                const container = document.getElementById(`players-${teamIdx}`);
                container.innerHTML = '';
                const offset = teamIdx * 7;
                for (let i = 0; i < 7; i++) {
                    const pIdx = i + offset;
                    const isLeader = (i === 0);
                    const role = isLeader ? "👑" : `回${i}`;
                    
                    const displayCheckHtml = isLeader ? 
                        `<span style="width:48px; display:inline-block; text-align:center; font-size:10px; color:#888;">(常時)</span>` :
                        `<label class="disp-label">
                            <input type="checkbox" id="check-disp-${pIdx}" onchange="updateNextDisplay(${pIdx}, this.checked)">表示
                        </label>`;

                    container.innerHTML += `
                        <div class="player-row ${isLeader ? 'is-leader' : ''}">
                            <span style="width:20px; font-size:11px;">${role}</span>
                            <input type="text" id="p-name-${pIdx}" placeholder="名前" onchange="updateName(${pIdx}, this.value)">
                            
                            <div class="p-score-box" title="個人の正解数">
                                <button class="p-score-btn" onclick="addPlayerScore(${pIdx}, -1)">-</button>
                                <span class="p-score-val" id="p-score-${pIdx}">0</span>
                                <button class="p-score-btn" onclick="addPlayerScore(${pIdx}, 1)">+</button>
                            </div>

                            <button class="btn-sm btn-copy" onclick="copyUrl(${pIdx})">🔗</button>
                            <button class="btn-sm btn-jump" onclick="openUrl(${pIdx})">🚀</button>
                            
                            ${displayCheckHtml}
                            
                            <label class="open-label">
                                <input type="checkbox" id="check-open-${pIdx}" onchange="updateNextOpen(${pIdx}, this.checked)">開
                            </label>
                            
                            <label class="correct-label">
                                <input type="checkbox" id="check-${pIdx}" onchange="updateNextCorrect(${pIdx}, this.checked)">赤
                            </label>
                            
                            <button class="btn-sm btn-clear" onclick="clearAnswer(${pIdx})">消</button>
                            <span id="status-${pIdx}" style="font-size:10px; margin-left:auto; white-space:nowrap;">未</span>
                        </div>
                    `;
                }
            });
        }
        renderPlayers();

        function updateName(idx, val) { 
            if (!gameRep.value) return;
            const arr = getSafeArray(gameRep.value.names, 21, '');
            arr[idx] = val;
            gameRep.value.names = arr;
        }

        window.updateNextDisplay = function(idx, val) {
            if (!gameRep.value) return;
            if (val) {
                const teamStart = Math.floor(idx / 7) * 7;
                let currentCount = 0;
                const dispArr = getSafeArray(gameRep.value.isDisplayed, 21, false);
                for (let i = 1; i < 7; i++) {
                    if (dispArr[teamStart + i]) currentCount++;
                }
                if (currentCount >= 4) {
                    alert("各チームで画面に表示できる回答者は最大4人までです！\n他の人のチェックを外してください。");
                    document.getElementById(`check-disp-${idx}`).checked = false;
                    return; 
                }
            }
            const arr = getSafeArray(gameRep.value.isDisplayed, 21, false);
            arr[idx] = val;
            gameRep.value.isDisplayed = arr;
        }

        window.updateNextOpen = function(idx, val) { 
            if (!gameRep.value) return;
            const arr = getSafeArray(gameRep.value.nextOpen, 21, false);
            arr[idx] = val;
            gameRep.value.nextOpen = arr;
        }

        window.updateNextCorrect = function(idx, val) { 
            if (!gameRep.value) return;
            const arr = getSafeArray(gameRep.value.nextCorrect, 21, false);
            arr[idx] = val;
            gameRep.value.nextCorrect = arr;
        }

        window.applyOpen = function(teamIdx) {
            if (!gameRep.value) return;
            const offset = teamIdx * 7;
            let isNewlyOpened = false;
            const newIsOpen = getSafeArray(gameRep.value.isOpen, 21, false);
            const nextOpen = getSafeArray(gameRep.value.nextOpen, 21, false);
            const answers = getSafeArray(gameRep.value.answers, 21, '');

            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                if (nextOpen[pIdx] && !newIsOpen[pIdx] && answers[pIdx] !== '') {
                    isNewlyOpened = true;
                }
                newIsOpen[pIdx] = nextOpen[pIdx];
            }
            gameRep.value.isOpen = newIsOpen;
            if (isNewlyOpened) nodecg.sendMessage('play_open_se');
        }

        window.openAll = function(teamIdx) {
            if (!gameRep.value) return;
            const offset = teamIdx * 7;
            let changed = false;
            const newIsOpen = getSafeArray(gameRep.value.isOpen, 21, false);
            const newNextOpen = getSafeArray(gameRep.value.nextOpen, 21, false);
            const answers = getSafeArray(gameRep.value.answers, 21, '');

            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                if (!newIsOpen[pIdx] && answers[pIdx] !== '') {
                    newIsOpen[pIdx] = true;
                    newNextOpen[pIdx] = true; 
                    changed = true;
                }
            }
            if (changed) {
                gameRep.value.isOpen = newIsOpen;
                gameRep.value.nextOpen = newNextOpen;
                nodecg.sendMessage('play_open_se');
            } else {
                alert("新しくオープンできる回答がありません。");
            }
        }
        
        window.applyCorrect = function(teamIdx) {
            if (!gameRep.value) return;
            const offset = teamIdx * 7;
            const newIsCorrect = getSafeArray(gameRep.value.isCorrect, 21, false);
            const nextCorrect = getSafeArray(gameRep.value.nextCorrect, 21, false);

            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                newIsCorrect[pIdx] = nextCorrect[pIdx];
            }
            gameRep.value.isCorrect = newIsCorrect;
        }

        window.clearTeamAnswers = function(teamIdx) {
            if(!confirm("このチームの【回答】と【チェック項目】をすべて消去しますか？（名前と正解数は残ります）")) return;
            if (!gameRep.value) return;
            const offset = teamIdx * 7;
            
            const newAnswers = getSafeArray(gameRep.value.answers, 21, '');
            const newIsOpen = getSafeArray(gameRep.value.isOpen, 21, false);
            const newIsCorrect = getSafeArray(gameRep.value.isCorrect, 21, false);
            const newNextCorrect = getSafeArray(gameRep.value.nextCorrect, 21, false);
            const newNextOpen = getSafeArray(gameRep.value.nextOpen, 21, false);

            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                newAnswers[pIdx] = '';
                newIsOpen[pIdx] = false;
                newIsCorrect[pIdx] = false;
                newNextCorrect[pIdx] = false;
                newNextOpen[pIdx] = false;
            }
            
            gameRep.value.answers = newAnswers;
            gameRep.value.isOpen = newIsOpen;
            gameRep.value.isCorrect = newIsCorrect;
            gameRep.value.nextCorrect = newNextCorrect;
            gameRep.value.nextOpen = newNextOpen;
        }

        function clearAnswer(idx) { 
            if (!gameRep.value) return;
            
            const newAnswers = getSafeArray(gameRep.value.answers, 21, '');
            const newIsOpen = getSafeArray(gameRep.value.isOpen, 21, false);
            const newIsCorrect = getSafeArray(gameRep.value.isCorrect, 21, false);
            const newNextCorrect = getSafeArray(gameRep.value.nextCorrect, 21, false);
            const newNextOpen = getSafeArray(gameRep.value.nextOpen, 21, false);

            newAnswers[idx] = '';
            newIsOpen[idx] = false;
            newIsCorrect[idx] = false;
            newNextCorrect[idx] = false;
            newNextOpen[idx] = false;

            gameRep.value.answers = newAnswers;
            gameRep.value.isOpen = newIsOpen;
            gameRep.value.isCorrect = newIsCorrect;
            gameRep.value.nextCorrect = newNextCorrect;
            gameRep.value.nextOpen = newNextOpen;
        }

        gameRep.on('change', (newVal) => {
            if(!newVal) return;
            
            // 🔴 過去のデータ（14人等）をすべて安全な21人（または3チーム）に変換
            const isDisplayed = getSafeArray(newVal.isDisplayed, 21, false);
            const nextOpen = getSafeArray(newVal.nextOpen, 21, false);
            const nextCorrect = getSafeArray(newVal.nextCorrect, 21, false);
            const playerScores = getSafeArray(newVal.playerScores, 21, 0);
            const teamScores = getSafeArray(newVal.teamScores, 3, 0);
            const teamNames = getSafeArray(newVal.teamNames, 3, '');
            const teamThemes = getSafeArray(newVal.teamThemes, 3, '');
            const names = getSafeArray(newVal.names, 21, '');
            const answers = getSafeArray(newVal.answers, 21, '');
            const isOpen = getSafeArray(newVal.isOpen, 21, false);

            [0, 1, 2].forEach(teamIdx => {
                const badge = document.getElementById(`badge-${teamIdx}`);
                const btnActive = document.getElementById(`btn-active-${teamIdx}`);
                if(badge) badge.style.display = newVal.activeTeam === teamIdx ? 'inline-block' : 'none';
                if(btnActive) btnActive.disabled = newVal.activeTeam === teamIdx;

                const tName = document.getElementById(`t-name-${teamIdx}`);
                if(tName && document.activeElement !== tName) tName.value = teamNames[teamIdx];

                const tTheme = document.getElementById(`t-theme-${teamIdx}`);
                if(tTheme && document.activeElement !== tTheme) tTheme.value = teamThemes[teamIdx];

                const tScore = document.getElementById(`t-score-${teamIdx}`);
                if(tScore && document.activeElement !== tScore) tScore.value = teamScores[teamIdx];
            });

            for(let i=0; i<21; i++) {
                const nameInp = document.getElementById(`p-name-${i}`);
                if(nameInp && document.activeElement !== nameInp) nameInp.value = names[i];
                
                const pScore = document.getElementById(`p-score-${i}`);
                if(pScore) pScore.innerText = playerScores[i];

                const checkDisp = document.getElementById(`check-disp-${i}`);
                if(checkDisp) checkDisp.checked = isDisplayed[i];

                const checkOpen = document.getElementById(`check-open-${i}`);
                if(checkOpen) checkOpen.checked = nextOpen[i];
                
                const checkCorrect = document.getElementById(`check-${i}`);
                if(checkCorrect) checkCorrect.checked = nextCorrect[i];

                const status = document.getElementById(`status-${i}`);
                if(status) {
                    if(answers[i] !== '') { status.innerText = '✅完'; status.style.color = '#e91e63'; }
                    else { status.innerText = '未'; status.style.color = '#999'; }
                }
            }
        });
    </script>
</body>
</html>
