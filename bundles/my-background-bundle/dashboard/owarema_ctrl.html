<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 10px; margin: 0; background: #f5f5f5; }
        .wrapper { display: flex; gap: 15px; width: 100%; }
        .col { flex: 1; background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .col-a { border-top: 5px solid #ff9800; }
        .col-b { border-top: 5px solid #2196f3; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .team-title { font-size: 18px; font-weight: bold; }
        .active-btn { background: #4CAF50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .active-btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .input-group { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .input-group label { width: 70px; font-size: 13px; font-weight: bold; }
        .input-group input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        .player-row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; padding: 8px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; }
        .player-row input[type="text"] { width: 90px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-sm { padding: 6px 8px; font-size: 12px; cursor: pointer; border: none; border-radius: 3px; color: white; transition: 0.1s; font-weight: bold; }
        .btn-sm:hover { opacity: 0.8; }
        .btn-copy { background: #009688; }
        .btn-jump { background: #795548; }
        .btn-open { background: #00bcd4; width: 80px; } 
        .btn-clear { background: #9e9e9e; }
        
        .correct-label { font-size: 11px; font-weight: bold; cursor: pointer; background: #ffebee; padding: 4px 8px; border-radius: 4px; border: 1px solid #ffcdd2; color: #d32f2f; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
        
        .is-active-badge { display: inline-block; padding: 2px 6px; background: #ff0000; color: white; border-radius: 10px; font-size: 12px; margin-left: 10px; }

        .team-actions { display: flex; gap: 10px; margin-top: 15px; }
        .team-actions button { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 13px; }
        .btn-apply-correct { background: #e91e63; }
        .btn-clear-team { background: #607d8b; }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Team A -->
        <div class="col col-a">
            <div class="header-row">
                <div class="team-title">🟥 チームA <span id="badge-0" class="is-active-badge" style="display:none;">配信中</span></div>
                <button class="active-btn" id="btn-active-0">このチームを配信画面に表示</button>
            </div>
            <div class="input-group">
                <label>チーム名</label><input type="text" id="t-name-0" placeholder="チームA" onchange="updateTeamMeta(0, 'name', this.value)">
            </div>
            <div class="input-group">
                <label>お題</label><input type="text" id="t-theme-0" placeholder="チームAのお題" onchange="updateTeamMeta(0, 'theme', this.value)">
            </div>
            <!-- 🔴 得点入力欄を追加 -->
            <div class="input-group">
                <label>得点</label>
                <div style="display:flex; gap:5px; flex:1;">
                    <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(0, -10)">-10</button>
                    <input type="number" id="t-score-0" value="0" style="text-align:center; font-weight:bold; font-size:16px;" onchange="updateTeamMeta(0, 'score', this.value)">
                    <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(0, 10)">+10</button>
                </div>
            </div>
            <hr>
            <div id="players-0"></div>
            
            <div class="team-actions">
                <button class="btn-apply-correct" onclick="applyCorrect(0)">🔴 赤背景を一斉反映</button>
                <button class="btn-clear-team" onclick="clearTeamAnswers(0)">🧹 回答・赤背景を一括消去</button>
            </div>
        </div>

        <!-- Team B -->
        <div class="col col-b">
            <div class="header-row">
                <div class="team-title">🟦 チームB <span id="badge-1" class="is-active-badge" style="display:none;">配信中</span></div>
                <button class="active-btn" id="btn-active-1">このチームを配信画面に表示</button>
            </div>
            <div class="input-group">
                <label>チーム名</label><input type="text" id="t-name-1" placeholder="チームB" onchange="updateTeamMeta(1, 'name', this.value)">
            </div>
            <div class="input-group">
                <label>お題</label><input type="text" id="t-theme-1" placeholder="チームBのお題" onchange="updateTeamMeta(1, 'theme', this.value)">
            </div>
            <!-- 🔴 得点入力欄を追加 -->
            <div class="input-group">
                <label>得点</label>
                <div style="display:flex; gap:5px; flex:1;">
                    <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(1, -10)">-10</button>
                    <input type="number" id="t-score-1" value="0" style="text-align:center; font-weight:bold; font-size:16px;" onchange="updateTeamMeta(1, 'score', this.value)">
                    <button class="btn-sm" style="background:#555; padding: 6px 12px;" onclick="addScore(1, 10)">+10</button>
                </div>
            </div>
            <hr>
            <div id="players-1"></div>

            <div class="team-actions">
                <button class="btn-apply-correct" onclick="applyCorrect(1)">🔴 赤背景を一斉反映</button>
                <button class="btn-clear-team" onclick="clearTeamAnswers(1)">🧹 回答・赤背景を一括消去</button>
            </div>
        </div>
    </div>

    <script>
        const gameRep = nodecg.Replicant('owarematenState', {
            defaultValue: {
                teamNames: ['チームA', 'チームB'],
                teamThemes: ['', ''],
                teamScores: [0, 0], // 🔴 スコアのデフォルト値を追加
                activeTeam: 0,
                names: Array(14).fill(''),
                answers: Array(14).fill(''),
                isOpen: Array(14).fill(false),
                isCorrect: Array(14).fill(false),
                nextCorrect: Array(14).fill(false)
            },
            persistent: true
        });

        window.getPadUrl = function(idx) { return `${window.location.origin}/bundles/my-background-bundle/dashboard/owarema_pad.html?p=${idx}&standalone=true`; }
        window.copyUrl = function(idx) { navigator.clipboard.writeText(getPadUrl(idx)).then(() => alert(`プレイヤー${idx+1}のパッドURLをコピーしました`)); }
        window.openUrl = function(idx) { window.open(getPadUrl(idx), '_blank'); }

        function updateTeamMeta(teamIdx, key, val) {
            if (!gameRep.value) return;
            if (!gameRep.value.teamScores) gameRep.value.teamScores = [0, 0]; // 過去データ保護

            if (key === 'name') gameRep.value.teamNames[teamIdx] = val;
            if (key === 'theme') gameRep.value.teamThemes[teamIdx] = val;
            if (key === 'score') gameRep.value.teamScores[teamIdx] = parseInt(val, 10) || 0;
        }

        // 🔴 スコアの増減処理
        window.addScore = function(teamIdx, amount) {
            if (!gameRep.value) return;
            if (!gameRep.value.teamScores) gameRep.value.teamScores = [0, 0];
            gameRep.value.teamScores[teamIdx] = (gameRep.value.teamScores[teamIdx] || 0) + amount;
        }

        document.getElementById('btn-active-0').onclick = () => { if(gameRep.value) gameRep.value.activeTeam = 0; };
        document.getElementById('btn-active-1').onclick = () => { if(gameRep.value) gameRep.value.activeTeam = 1; };

        function renderPlayers() {
            [0, 1].forEach(teamIdx => {
                const container = document.getElementById(`players-${teamIdx}`);
                container.innerHTML = '';
                const offset = teamIdx === 1 ? 7 : 0;
                for (let i = 0; i < 7; i++) {
                    const pIdx = i + offset;
                    const role = i === 0 ? "👑" : `回答${i}`;
                    container.innerHTML += `
                        <div class="player-row">
                            <span style="width:35px; font-size:12px;">${role}</span>
                            <input type="text" id="p-name-${pIdx}" placeholder="名前" onchange="updateName(${pIdx}, this.value)">
                            <button class="btn-sm btn-copy" onclick="copyUrl(${pIdx})">🔗</button>
                            <button class="btn-sm btn-jump" onclick="openUrl(${pIdx})">🚀</button>
                            <button class="btn-sm btn-open" id="btn-open-${pIdx}" onclick="toggleOpen(${pIdx})">👁️ オープン</button>
                            
                            <label class="correct-label">
                                <input type="checkbox" id="check-${pIdx}" onchange="updateNextCorrect(${pIdx}, this.checked)"> 赤背景
                            </label>
                            
                            <button class="btn-sm btn-clear" onclick="clearAnswer(${pIdx})">消去</button>
                            <span id="status-${pIdx}" style="font-size:11px; margin-left:auto;">未提出</span>
                        </div>
                    `;
                }
            });
        }
        renderPlayers();

        function updateName(idx, val) { 
            if(gameRep.value) gameRep.value.names[idx] = val; 
        }
        function toggleOpen(idx) { 
            if(!gameRep.value) return;
            gameRep.value.isOpen[idx] = !gameRep.value.isOpen[idx]; 
            if(gameRep.value.isOpen[idx]) nodecg.sendMessage('play_open_se');
        }
        
        window.updateNextCorrect = function(idx, val) {
            if(!gameRep.value) return;
            if(!gameRep.value.nextCorrect) gameRep.value.nextCorrect = Array(14).fill(false);
            gameRep.value.nextCorrect[idx] = val;
        }

        window.applyCorrect = function(teamIdx) {
            if(!gameRep.value || !gameRep.value.nextCorrect) return;
            const offset = teamIdx === 1 ? 7 : 0;
            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                gameRep.value.isCorrect[pIdx] = gameRep.value.nextCorrect[pIdx];
            }
        }

        window.clearTeamAnswers = function(teamIdx) {
            if(!confirm("このチームの【回答】と【赤背景のチェック】をすべて消去しますか？（名前は残ります）")) return;
            if(!gameRep.value) return;
            const offset = teamIdx === 1 ? 7 : 0;
            for(let i=0; i<7; i++) {
                const pIdx = i + offset;
                gameRep.value.answers[pIdx] = '';
                gameRep.value.isOpen[pIdx] = false;
                gameRep.value.isCorrect[pIdx] = false;
                if(gameRep.value.nextCorrect) gameRep.value.nextCorrect[pIdx] = false;
            }
        }

        function clearAnswer(idx) { 
            if(!gameRep.value) return;
            gameRep.value.answers[idx] = ''; 
            gameRep.value.isOpen[idx] = false; 
            gameRep.value.isCorrect[idx] = false; 
            if(gameRep.value.nextCorrect) gameRep.value.nextCorrect[idx] = false;
        }

        gameRep.on('change', (newVal) => {
            if(!newVal) return;
            
            if(!newVal.nextCorrect) newVal.nextCorrect = Array(14).fill(false);
            if(!newVal.teamScores) newVal.teamScores = [0, 0]; // 過去データ保護

            document.getElementById('badge-0').style.display = newVal.activeTeam === 0 ? 'inline-block' : 'none';
            document.getElementById('btn-active-0').disabled = newVal.activeTeam === 0;
            document.getElementById('badge-1').style.display = newVal.activeTeam === 1 ? 'inline-block' : 'none';
            document.getElementById('btn-active-1').disabled = newVal.activeTeam === 1;

            if(newVal.teamNames) {
                if(document.activeElement.id !== 't-name-0') document.getElementById('t-name-0').value = newVal.teamNames[0] || '';
                if(document.activeElement.id !== 't-name-1') document.getElementById('t-name-1').value = newVal.teamNames[1] || '';
            }
            if(newVal.teamThemes) {
                if(document.activeElement.id !== 't-theme-0') document.getElementById('t-theme-0').value = newVal.teamThemes[0] || '';
                if(document.activeElement.id !== 't-theme-1') document.getElementById('t-theme-1').value = newVal.teamThemes[1] || '';
            }
            // 🔴 得点の表示を同期
            if(newVal.teamScores) {
                if(document.activeElement.id !== 't-score-0') document.getElementById('t-score-0').value = newVal.teamScores[0] || 0;
                if(document.activeElement.id !== 't-score-1') document.getElementById('t-score-1').value = newVal.teamScores[1] || 0;
            }

            for(let i=0; i<14; i++) {
                const nameInp = document.getElementById(`p-name-${i}`);
                if(nameInp && document.activeElement !== nameInp) nameInp.value = newVal.names[i] || '';
                
                const btnOpen = document.getElementById(`btn-open-${i}`);
                if(btnOpen) {
                    btnOpen.style.opacity = newVal.isOpen[i] ? '0.5' : '1';
                    btnOpen.innerText = newVal.isOpen[i] ? '👁️ 閉じる' : '👁️ オープン';
                }
                
                const checkCorrect = document.getElementById(`check-${i}`);
                if(checkCorrect) checkCorrect.checked = newVal.nextCorrect[i];

                const status = document.getElementById(`status-${i}`);
                if(status) {
                    if(newVal.answers[i] !== '') { status.innerText = '✅完了'; status.style.color = '#e91e63'; }
                    else { status.innerText = '未提出'; status.style.color = '#999'; }
                }
            }
        });
    </script>
</body>
</html>
