<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; padding: 10px; }
        textarea { width: 100%; height: 100px; resize: vertical; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #000; color: #fff; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <textarea id="tweet-text" placeholder="ここに投稿内容を入力..."></textarea>
    <button id="post-btn">Xの投稿画面を開く</button>
    <div id="status"></div>

    <script>
        const btn = document.getElementById('post-btn');
        const text = document.getElementById('tweet-text');
        const status = document.getElementById('status');

        btn.addEventListener('click', () => {
            const content = text.value.trim();
            if (!content) {
                status.style.color = 'red';
                status.textContent = 'テキストを入力してください。';
                return;
            }

            // 改行や記号をURLで安全に送信できる形式（パーセントエンコーディング）に変換
            const encodedText = encodeURIComponent(content);
            
            // Xの標準Web Intent機能を使用してURLを生成
            const intentUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;

            // 新しいタブでXの投稿画面をポップアップ表示
            window.open(intentUrl, '_blank');

            status.style.color = 'green';
            status.textContent = '✅ Xの投稿画面を新しいタブで開きました。';
        });
    </script>
</body>
</html>
