<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手書き回答パッド</title>
    <style>
        body { margin: 0; padding: 0; background: #eceff1; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .header { padding: 15px; background: #37474f; color: white; text-align: center; font-size: 20px; font-weight: bold; }
        .canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; position: relative; }
        
        /* 🔴 キャンバスの背景を青に変更 */
        canvas { background-color: #1565c0; border: 4px solid #b0bec5; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); touch-action: none; cursor: crosshair; max-width: 100%; max-height: 100%; }
        
        .controls { padding: 15px; display: flex; gap: 15px; background: #ffffff; border-top: 1px solid #cfd8dc; }
        button { flex: 1; padding: 16px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; }
        #btn-clear { background: #78909c; }
        #btn-submit { background: #ff9800; }
        #status-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:none; justify-content:center; align-items:center; font-size:28px; font-weight:bold; color:#e91e63; flex-direction: column; z-index: 100; }
        #btn-edit { margin-top: 30px; background: #2196f3; padding: 12px 30px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header" id="player-label">読み込み中...</div>
    
    <div class="canvas-container">
        <!-- 🔴 高さを368pxに変更し、配信画面の枠とアスペクト比を完全一致させました -->
        <canvas id="draw-canvas" width="800" height="368"></canvas>
        <div id="status-overlay">
            <div>回答を送信しました！</div>
            <button id="btn-edit">書き直す</button>
        </div>
    </div>
    
    <div class="controls">
        <button id="btn-clear">🗑️ 消す</button>
        <button id="btn-submit">🚀 送信する</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = parseInt(urlParams.get('p') || '0', 10);
        const gameRep = nodecg.Replicant('dqChickenState');

        gameRep.on('change', (newVal) => {
            if (!newVal) return;
            const pName = (newVal.names && newVal.names[playerId] && newVal.names[playerId].trim() !== '') ? newVal.names[playerId] : `走者 ${playerId + 1}`;
            document.getElementById('player-label').innerText = `${pName} のフリップ`;

            const overlay = document.getElementById('status-overlay');
            if (newVal.answers && newVal.answers[playerId] !== '') {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        });

        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        
        // 🔴 初期背景を青色（#1565c0）、ペンの色を白（#ffffff）に変更
        ctx.fillStyle = "#1565c0"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height); 
        ctx.strokeStyle = '#ffffff'; 
        ctx.lineWidth = 6; 
        ctx.lineCap = 'round'; 
        ctx.lineJoin = 'round';      

        let isDrawing = false, lastX = 0, lastY = 0;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }

        function startDrawing(e) { e.preventDefault(); isDrawing = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; }
        function draw(e) { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke(); lastX = pos.x; lastY = pos.y; }
        function stopDrawing(e) { e.preventDefault(); isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stopDrawing, { passive: false });
        
        document.getElementById('btn-clear').addEventListener('click', () => {
            if (confirm('消去しますか？')) { 
                // 🔴 消去時も青背景で塗りつぶす
                ctx.fillStyle = "#1565c0"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height); 
            }
        });

        document.getElementById('btn-submit').addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            const state = JSON.parse(JSON.stringify(gameRep.value || {}));
            if (!state.answers) state.answers = Array(8).fill('');
            state.answers[playerId] = dataUrl;
            gameRep.value = state;
        });

        document.getElementById('btn-edit').addEventListener('click', () => {
            const state = JSON.parse(JSON.stringify(gameRep.value || {}));
            if (!state.answers) state.answers = Array(8).fill('');
            state.answers[playerId] = ''; 
            gameRep.value = state;
        });
    </script>
</body>
</html>
