<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 10px; background: #f5f5f5; margin: 0; }
        
        .timer-panel {
            background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-top: 5px solid #607d8b; display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px;
        }
        .timer-panel h3 { margin: 0; font-size: 16px; color: #333; width: 100%; }
        .timer-inputs { display: flex; align-items: center; gap: 5px; }
        .timer-inputs input { width: 50px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .timer-actions { display: flex; gap: 10px; flex: 1; justify-content: flex-end; }
        .btn-timer { padding: 8px 15px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        #btn-timer-set { background: #2196f3; }
        #btn-timer-toggle { background: #4caf50; min-width: 110px; }
        #btn-timer-reset { background: #f44336; }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .team-box { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid; }
        #box-0 { border-color: #d32f2f; }
        #box-1 { border-color: #1976d2; }
        #box-2 { border-color: #388e3c; }
        #box-3 { border-color: #7b1fa2; }

        .team-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 4px; }
        .input-group input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        /* 🔴 新設：並べて配置するためのFlexレイアウト */
        .flex-inputs { display: flex; gap: 10px; }
        .flex-inputs .input-group { flex: 1; }

        .score-ctrl { display: flex; align-items: center; gap: 5px; }
        .score-ctrl input { flex: 1; text-align: center; font-size: 18px; font-weight: bold; padding: 6px; border: 1px solid #ccc; border-radius: 4px; width: 60px; }
        .btn-score { padding: 8px 10px; font-size: 14px; font-weight: bold; background: #607d8b; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-score:hover { background: #455a64; }
        .btn-clear { width: 100%; padding: 10px; margin-top: 5px; background: #e0e0e0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #333; }
        .btn-clear:hover { background: #bdbdbd; }
    </style>
</head>
<body>

    <div class="timer-panel">
        <h3>⏱️ カウントダウンタイマー</h3>
        <div class="timer-inputs">
            <input type="number" id="timer-m" value="10" min="0"> 分
            <input type="number" id="timer-s" value="0" min="0" max="59"> 秒
            <button class="btn-timer" id="btn-timer-set" onclick="setTimer()">設定</button>
        </div>
        <div class="timer-actions">
            <button class="btn-timer" id="btn-timer-toggle" onclick="toggleTimer()">▶️ スタート</button>
            <button class="btn-timer" id="btn-timer-reset" onclick="resetTimer()">🔄 リセット</button>
        </div>
    </div>

    <div class="grid-container" id="teams-container">
        <!-- JSで4チーム分生成 -->
    </div>

    <script>
        const gameRep = nodecg.Replicant('paintState', {
            defaultValue: { 
                answers: ['', '', '', ''], isOpen: [false, false, false, false], 
                names: ['Aチーム', 'Bチーム', 'Cチーム', 'Dチーム'], 
                runnerNames: ['', '', '', ''], // 🔴 走者名配列を追加
                live: ['', '', '', ''], scores: [0, 0, 0, 0] 
            },
            persistent: true
        });

        const timerRep = nodecg.Replicant('paintTimer', {
            defaultValue: { isRunning: false, totalSeconds: 600, remainingSeconds: 600, endTime: null },
            persistent: true
        });

        window.setTimer = function() {
            if (!timerRep.value) return;
            const m = parseInt(document.getElementById('timer-m').value) || 0;
            const s = parseInt(document.getElementById('timer-s').value) || 0;
            const total = m * 60 + s;
            const state = JSON.parse(JSON.stringify(timerRep.value));
            state.totalSeconds = total;
            state.remainingSeconds = total;
            state.isRunning = false;
            state.endTime = null;
            timerRep.value = state;
        }

        window.toggleTimer = function() {
            if (!timerRep.value) return;
            const state = JSON.parse(JSON.stringify(timerRep.value));
            if (state.isRunning) {
                state.isRunning = false;
                state.remainingSeconds = Math.max(0, (state.endTime - Date.now()) / 1000);
                state.endTime = null;
            } else {
                state.isRunning = true;
                state.endTime = Date.now() + state.remainingSeconds * 1000;
            }
            timerRep.value = state;
        }

        window.resetTimer = function() {
            if (!timerRep.value) return;
            const state = JSON.parse(JSON.stringify(timerRep.value));
            state.remainingSeconds = state.totalSeconds;
            state.isRunning = false;
            state.endTime = null;
            timerRep.value = state;
        }

        timerRep.on('change', (newVal) => {
            if (!newVal) return;
            const btn = document.getElementById('btn-timer-toggle');
            if (btn) {
                btn.innerText = newVal.isRunning ? '⏸️ 一時停止' : '▶️ スタート';
                btn.style.background = newVal.isRunning ? '#ff9800' : '#4caf50';
            }
        });

        function modifyState(modifierFunc) {
            if (!gameRep.value) return;
            const s = JSON.parse(JSON.stringify(gameRep.value));
            if (!s.names) s.names = ['Aチーム', 'Bチーム', 'Cチーム', 'Dチーム'];
            if (!s.scores) s.scores = [0, 0, 0, 0];
            if (!s.runnerNames) s.runnerNames = ['', '', '', '']; // 🔴 欠損保護
            modifierFunc(s);
            gameRep.value = s;
        }

        const teamLabels = ['🟥 左上 (A)', '🟦 右上 (B)', '🟩 左下 (C)', '🟪 右下 (D)'];
        const container = document.getElementById('teams-container');

        for(let i=0; i<4; i++) {
            container.innerHTML += `
                <div class="team-box" id="box-${i}">
                    <div class="team-title">${teamLabels[i]}</div>
                    <div class="flex-inputs">
                        <div class="input-group">
                            <label>チーム名 / お絵かき者</label>
                            <input type="text" id="name-${i}" placeholder="チーム名" onchange="updateName(${i}, this.value)">
                        </div>
                        <!-- 🔴 走者名入力欄を追加 -->
                        <div class="input-group">
                            <label>走者名 (ゲーム側)</label>
                            <input type="text" id="runner-${i}" placeholder="走者名" onchange="updateRunner(${i}, this.value)">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>得点 (pt)</label>
                        <div class="score-ctrl">
                            <button class="btn-score" onclick="addScore(${i}, -10)">-10</button>
                            <button class="btn-score" onclick="addScore(${i}, -1)">-1</button>
                            <input type="number" id="score-${i}" value="0" onchange="updateScore(${i}, this.value)">
                            <button class="btn-score" onclick="addScore(${i}, 1)">+1</button>
                            <button class="btn-score" onclick="addScore(${i}, 10)">+10</button>
                        </div>
                    </div>
                    <button class="btn-clear" onclick="clearBoard(${i})">🧹 盤面のみリセット</button>
                </div>
            `;
        }

        window.updateName = function(idx, val) { modifyState(s => s.names[idx] = val); }
        // 🔴 走者名保存用関数
        window.updateRunner = function(idx, val) { modifyState(s => s.runnerNames[idx] = val); }
        window.updateScore = function(idx, val) { modifyState(s => s.scores[idx] = parseInt(val, 10) || 0); }
        window.addScore = function(idx, amount) { modifyState(s => s.scores[idx] += amount); }

        window.clearBoard = function(idx) {
            if(!confirm("この枠に描かれている絵をリセットしますか？\n（名前と得点は残ります）")) return;
            modifyState(s => {
                s.answers[idx] = '';
                s.live[idx] = '';
                s.isOpen[idx] = false;
            });
        }

        gameRep.on('change', (newVal) => {
            if(!newVal) return;
            for(let i=0; i<4; i++) {
                const nameInp = document.getElementById(`name-${i}`);
                if (nameInp && document.activeElement !== nameInp) {
                    nameInp.value = (newVal.names && newVal.names[i]) ? newVal.names[i] : '';
                }
                // 🔴 走者名同期
                const runnerInp = document.getElementById(`runner-${i}`);
                if (runnerInp && document.activeElement !== runnerInp) {
                    runnerInp.value = (newVal.runnerNames && newVal.runnerNames[i]) ? newVal.runnerNames[i] : '';
                }
                const scoreInp = document.getElementById(`score-${i}`);
                if (scoreInp && document.activeElement !== scoreInp) {
                    scoreInp.value = (newVal.scores && newVal.scores[i]) ? newVal.scores[i] : 0;
                }
            }
        });
    </script>
</body>
</html>
